services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: bda-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      CLUSTER_ID: "BDA-Mini-Project-Cluster-01"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  hadoop:
    build:
      context: .
      dockerfile: Dockerfile.hadoop
    image: bda-hadoop:3.3.6-py3
    container_name: bda-hadoop
    ports:
      - "9870:9870"   # HDFS NameNode Web UI
      - "8088:8088"   # YARN ResourceManager Web UI
      - "9000:9000"   # HDFS RPC
    volumes:
      - hadoop-data:/opt/hadoop/data
      - ./mapreduce:/opt/mapreduce
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    command: >
      bash -c "
        rm -rf /opt/hadoop/data/* &&
        hdfs namenode -format -force &&
        hdfs namenode &
        sleep 3 &&
        hdfs datanode &
        yarn resourcemanager &
        yarn nodemanager &
        sleep 5 &&
        hdfs dfsadmin -safemode leave || true &&
        sleep infinity
      "
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfs -ls / || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  kafka-data:
  hadoop-data:
